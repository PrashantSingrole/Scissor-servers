server:
  port: 0
  
#datasource configuration  
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}${DB_PORT:3306}/${DB_NAME:salon_detail}?createDatabaseIfNotExist=true
    username: root
    password: DP_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
   
  # jpa configuration 
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect
    show-sql: true
  
  application:
    name: salon-service
   
# dailect spring boot can auto detects, but we can set here also
    
eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
            defaultZone: ${EUREKA_SERVER_URL}
    
    
      

    
